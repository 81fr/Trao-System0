<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>طباعة بطاقة المستفيد - تراؤف</title>
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all-svg.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-teal: #00A59B;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .no-print-bar {
            background: #fff;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .no-print-bar h2 {
            margin: 0;
            color: var(--brand-teal);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--brand-teal);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #008f86;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .print-container {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 15mm;
            box-sizing: border-box;
            background: none;
        }

        .print-header {
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .print-header img {
            max-height: 60px;
        }

        .print-header h1 {
            font-size: 1.5rem;
            margin: 10px 0 0 0;
            color: #475569;
        }

        /* Beautiful Individual Card */
        .cards-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .ind-card-print {
            background: linear-gradient(135deg, #1e293b, #0f172a, #312e81) !important;
            color: #fff !important;
            border-radius: 12px;
            padding: 15px;
            width: 85.6mm;
            height: 53.98mm;
            box-sizing: border-box;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15) !important;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .ind-card-print::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 100% 0%, rgba(255, 255, 255, .15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(255, 255, 255, .08) 0%, transparent 40%) !important;
            pointer-events: none;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Front specific */
        .c-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
            margin-bottom: auto;
            /* let flex distribute gap */
        }

        .c-wallet-badge {
            background: transparent !important;
            color: #fff !important;
            padding: 0;
            font-weight: 700;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .c-logo-placeholder {
            display: none !important;
            /* using reflection instead */
        }

        /* New decorative reflection like in the app */
        .bvc-reflection {
            position: absolute;
            top: 0;
            left: 20%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, .15) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            pointer-events: none;
            z-index: 1;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .c-number {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .5);
            position: relative;
            z-index: 2;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 5px;
            color: #fff !important;
        }

        .c-details-grid {
            display: none;
            /* We will replace this with the bvc-footer style (name and expiry only) to match beneficiary card */
        }

        .bvc-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
        }

        .bvc-footer small {
            font-size: .45rem;
            opacity: 0.7;
            margin-bottom: 2px;
            letter-spacing: 1px;
            display: block;
            color: #fff !important;
        }

        .bvc-footer strong {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff !important;
        }

        .bvc-status {
            background: rgba(255, 255, 255, .1) !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: .55rem;
            font-weight: 600;
            color: #fff !important;
            display: inline-block;
        }

        /* Barcode Area in Front */
        .print-qrcode {
            margin-top: 5px;
            text-align: center;
            z-index: 2;
            position: relative;
            background: rgba(255, 255, 255, 0.85) !important;
            padding: 2px 5px;
            border-radius: 6px;
        }

        .barcode-container svg {
            /* Make barcode strokes black for contrast inside the white box */
            fill: #000 !important;
        }

        /* Print Media Query */
        @media print {
            body {
                background: #fff !important;
                padding: 0;
            }

            .no-print-bar {
                display: none !important;
            }

            .print-container {
                box-shadow: none;
                margin: 0;
                padding: 0;
                width: 100%;
            }

            @page {
                size: A4;
                margin: 10mm;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
</head>

<body>

    <!-- Action Bar -->
    <div class="no-print-bar">
        <h2><i class="fas fa-print"></i> لوحة طباعة بطاقات المستفيدين</h2>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-secondary" onclick="window.history.back()"><i class="fas fa-arrow-right"></i>
                عودة</button>
            <button class="btn" onclick="window.print()"><i class="fas fa-file-pdf"></i> استخراج ورقي / PDF</button>
        </div>
    </div>

    <!-- Print Area -->
    <div class="print-container">
        <div class="print-header">
            <img src="assets/logo.png" alt="TRAOF Logo" onerror="this.style.display='none'">
            <h1 id="printPageTitle">بطاقة المستفيد المعتمدة</h1>
        </div>

        <div class="cards-grid" id="printCardsGrid">
            <!-- Cards will be rendered here by JS -->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.gd('printCardsGr id');
            const urlParams = new URLSearchParams(window.location.search);
            const cardIdFilter = urlParams.get('id');
            const isSinglePrint = cardIdFilter !== null;

            let cards = Storage.get('cards') || [];

            if (isSinglePrint) {
                cards = cards.filter(c => c.id == cardIdFilter);
            }

            if (cards.length === 0) {
                grid.innerHTML = '<div style="text-align:center; padding:50px; color:#888;">لا توجد بطاقات مطابقة.</div>';
                return;
            }

            if (!isSinglePrint) {
                document.getElementById('printPageTitle').innerText = 'سجل البطاقات المعتمدة (الكل)';
            }

            grid.innerHTML = cards.map(c => {
                const formattedNum = c.number.replace(/(\d{4})(?=\d)/g, '$1 ');
                // Mock QR code using an API
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('TRAOF-' + c.number)}`;


                // Remove spaces for barcode value
                const cleanNum = c.number.replace(/\s/g, '');

                return `
                    <!-- Front of Card (Matches beneficiary-visual-card exactly) -->
                    <div class="ind-card-print">
                        <div class="bvc-reflection"></div>
                        
                        <div class="c-header-row">
                            <span class="c-wallet-badge"><img src="assets/logo.png" style="height:14px; filter: brightness(0) invert(1);" alt=""> ${c.wallet || 'تراؤف'}</span>
                            <span class="bvc-status">${c.status || '-'}</span>
                        </div>
                        
                        <div style="margin-top:auto;">
                            <div class="bvc-chip-row" style="margin-bottom:5px;">
                                <i class="fas fa-microchip" style="font-size:1.2rem; color:#ffd700;"></i>
                            </div>
                            
                            <div class="c-number">${formattedNum}</div>
                            
                            <div class="bvc-footer">
                                <div>
                                    <small>اسم المستفيد</small>
                                    <strong>${c.beneficiary || 'غير محدد'}</strong>
                                </div>
                                <div style="text-align:left;">
                                    <small>تاريخ الانتهاء</small>
                                    <strong>${c.expiry || '-'}</strong>
                                </div>
                            </div>
                        </div>

                        ${isSinglePrint ? `
                        <div class="print-qrcode" style="display:flex; justify-content:space-around; align-items:center;">
                            <div>
                                <img src="${qrUrl}" alt="QR Code" style="width:30px;height:30px;">
                            </div>
                            <div class="barcode-container" style="margin-left:5px;">
                                <svg class="barcode" jsbarcode-format="CODE128" jsbarcode-value="${cleanNum}" jsbarcode-displayvalue="true" jsbarcode-height="25" jsbarcode-width="1.2" jsbarcode-fontSize="10" jsbarcode-margin="0" jsbarcode-lineColor="#000"></svg>
                            </div>
                        </div>` : ''}
                    </div>

                    <!-- Back of Card (Only show when printing a single card for detailed view) -->
                    ${isSinglePrint ? `
                    <div class="ind-card-print ind-card-back" style="margin-top:20px;">
                        <div class="back-mag-stripe"></div>
                        <div class="back-instructions">
                            <h4><i class="fas fa-info-circle" style="color:#00A59B;"></i> تعليمات هامة</h4>
                            <p>هذه البطاقة مخصصة للاستخدام الشخصي للمستفيد الموضح اسمه بالأمام. يمنع نقلها أو رهنها.</p>
                            <p><strong>في حال العثور على هذه البطاقة المفقودة:</strong></p>
                            <p>الرجاء تسليمها لأقرب فرع لجمعية تراؤف أو الاتصال على الرقم الموحد: <strong>8003010083</strong></p>
                        </div>
                        <div class="barcode-container" style="margin-top:30px;">
                             <svg class="barcode" jsbarcode-format="CODE128" jsbarcode-value="${cleanNum}" jsbarcode-displayvalue="false" jsbarcode-height="30" jsbarcode-width="1.5" jsbarcode-margin="0"></svg>
                        </div>
                    </div>
                    ` : ''}
                `;

            }).join('');


            // Initialize Barcodes
            if (typeof JsBarcode !== 'undefined') {
                JsBarcode(".barcode").init();
            }

            // Automatically trigger print dialog for single prints after images load
            if (isSinglePrint) {
                setTimeout(() => {
                    window.print();
                }, 1000);
            }
        });
    </script>
</body>

</html>
